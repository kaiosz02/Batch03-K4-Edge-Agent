<style>
        .glass-card {
            background: rgba(19, 19, 20, 0.2);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .pet-glow-pulse {
            animation: pulse-aura 3s ease-in-out infinite;
        }

        @keyframes pulse-aura {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.05); }
        }

        .exp-gradient {
            background: linear-gradient(90deg, #2fd9f4 0%, #d3bbff 100%);
            box-shadow: 0 0 12px rgba(47, 217, 244, 0.5);
        }

        .floating-bounce {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="bg-background min-h-screen flex items-center justify-center p-6 selection:bg-tertiary selection:text-on-tertiary">
<!-- Background Ambient Light -->
<div class="fixed inset-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-secondary/10 blur-[120px] rounded-full"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] bg-tertiary/10 blur-[120px] rounded-full"></div>
</div>
<!-- Virtual Pet Widget Container -->
<div class="relative z-10 floating-bounce">
<!-- Floating Glassmorphism Widget -->
<div class="glass-card w-64 rounded-3xl p-stack-md flex flex-col items-center gap-stack-md transition-all duration-500 hover:shadow-[0_0_40px_rgba(47,217,244,0.15)]">
<!-- Top Status Bar -->
<div class="w-full flex justify-between items-center px-stack-xs">
<span class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1">
<span class="w-2 h-2 rounded-full bg-tertiary animate-pulse"></span>
                    Tâm trạng: Đang Vui 😻
                </span>
<button class="text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-[18px]">more_vert</span>
</button>
</div>
<!-- Pet Display Area -->
<div class="relative w-40 h-40 group cursor-pointer">
<!-- WebGL Background Aura -->
<div class="absolute inset-0 rounded-full overflow-hidden pet-glow-pulse">

</div>
<!-- Inner Circular Clipping for Pet -->
<div class="absolute inset-2 rounded-full overflow-hidden bg-surface-container-lowest/40 backdrop-blur-sm border border-white/5 flex items-center justify-center">
<img alt="Virtual AI Companion Owl" class="w-32 h-32 object-contain relative z-10 transition-transform duration-500 group-hover:scale-110" src="https://lh3.googleusercontent.com/aida/AP1WRLusbuP2Ftfdah5tMYniyboUUaFVVtrEJzAEFwoOqEkHHKRx9ZIvWOWIJOCki0quRTSJsZ8vT1gW8L58SaP_VMkrnD70G2FKBo_nafph4jq2jQQJ52aw7F6pbOit2dPf4jkwax22-U-MDs_MQlSswWU5FJu0M4qWmqajMeBAQQxjmDpau5a1FTYGR1CF0LIMUuJzbfVoW9JZZXGD_YPnZc5JHOFg4shmirXZX_j6PuN8Ii2fKu8V_8MVEgeQ"/>
</div>
<!-- Interactive Particles Overlay (Micro-interaction) -->
<div class="absolute -inset-2 pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-300">
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-1 h-1 bg-tertiary rounded-full animate-ping"></div>
<div class="absolute bottom-4 right-4 w-1 h-1 bg-secondary rounded-full animate-ping delay-75"></div>
<div class="absolute top-1/2 left-0 w-1 h-1 bg-primary rounded-full animate-ping delay-150"></div>
</div>
</div>

<div class="flex justify-between items-end">
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-tertiary">LVL 12</span>
<span class="font-display-lg-mobile text-[14px] text-on-surface leading-tight tracking-wide">Robot Owl</span>
</div>
<span class="font-label-sm text-[11px] text-on-surface-variant uppercase tracking-widest">EXP: 350/500</span>
</div>
<!-- Sleek Progress Bar -->

<div class="h-full exp-gradient rounded-full" style="width: 70%"></div>

</div>

        const widget = document.querySelector('.glass-card');
        widget.addEventListener('mouseenter', () => {
            console.log('Pet active: Generating focus aura');

        // Keyframe shim for shimmer
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `

                100% { transform: translateX(100%); }

        `;
